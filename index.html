<!DOCTYPE html>
<html>
    <head>
        <title>HTML fundamentos</title>
    </head>
    <body>
        <h1>Este é um tipo de título importante</h1>
        <h2>Este é um titulo menos importante</h2>
        <p>Paragrafo onde colocamos textos </p>
        <p>podemos ter varias formas de texto esse paragrafo serve
            para mostrar isso
        </p>

        <p>1º parágrafo, br/ - pula espaço </p>
        <br/>
        <p>2º parágrafo hr/ - cria divisão horizontal</p>
        <hr/>
        <p>3º parágrafo</p>
        <!--Este é um exemplo de comentario, porém devem ser usados
        com cuidado no HTMl, já que podem ser lidos se alguém quiser
        ler o código fonte-->
    </body>
</html>
