<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
</head>
<body>
    <!--Inline CSS-->
    <!--Bem fora de uso, pois é díficel de alterar -->
    <h1 style="color: red;">Mudar cor com Inline</h1>
    <h1 style="color: blue;">Outro titulo</h1>

    <!--Multiplas regras-->
    <!--São regras para encadeamento de atributos Inline, que faciltam o uso (mesmo em desuso)-->
    <h1 style="color:purple;font-size: 50px; border-bottom: 1px solid red;">Mudar cor e tamanho da fonte</h1>
    
</body>
</html>
