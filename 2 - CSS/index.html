<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <!--Internal CSS-->
    <style>
        p{
            color: gold;
            font-size: 50px;
        }
    </style>
    <!--External Css-->
    <link rel="stylesheet" href="/2 - CSS/css">
    <link rel="stylesheet" href="/2 - CSS/list.css">
</head>
<body>
    <!--Inline CSS-->
    <!--Bem fora de uso, pois é díficel de alterar -->
    <h1 style="color: red;">Mudar cor com Inline</h1>
    <h1 style="color: blue;">Outro titulo</h1>

    <!--Multiplas regras-->
    <!--São regras para encadeamento de atributos Inline, que faciltam o uso (mesmo em desuso)-->
    <h1 style="color:purple;font-size: 50px; border-bottom: 1px solid red;">Mudar cor e tamanho da fonte</h1>
    
    <!--Internal Css-->
    <p>Mudei pela internal CSS</p>
    <p>Se aplicam em varios (ou em todos os p) </p>
    <p>Aqui mais um</p>

    <!--External CSS-->
    <h3>Meu título verde</h3>

    <!--Varias Listas -->
    <ul>
        <li>Banana</li>
        <li>Maça</li>
        <li>Uva</li>
    </ul>
</body>
</html>
